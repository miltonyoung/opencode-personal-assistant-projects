services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_media_upload
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_media_upload"]
      interval: 5s
      timeout: 5s
      retries: 5

  upload-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/event_media_upload
      PGHOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
    command: ["sh", "-c", "npm run migrate && npm start"]
    restart: unless-stopped

  pruner:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/event_media_upload
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    command:
      - "sh"
      - "-c"
      - |
        while true; do
          npm run prune
          sleep 86400
        done
    restart: unless-stopped

volumes:
  postgres-data:
