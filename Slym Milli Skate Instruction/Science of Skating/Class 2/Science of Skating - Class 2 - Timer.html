<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science of Skating — Class 2 Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        :root {
            --pink: #FF6B9D;
            --purple: #9B59B6;
            --blue: #3498DB;
            --teal: #1ABC9C;
            --orange: #FF9F43;
            --dark: #2C3E50;
            --light: #F8F9FA;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: var(--purple);
            font-size: 1.6em;
            margin-bottom: 8px;
        }

        .date-line {
            color: var(--pink);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 6px;
        }

        .main-section {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--purple);
            margin-bottom: 8px;
        }

        .sub-section {
            font-size: 1.4em;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 20px;
            min-height: 2.5em;
        }

        .timer {
            font-size: 5em;
            font-weight: 800;
            color: var(--dark);
            line-height: 1;
            margin: 20px 0;
        }

        .timer.warning {
            color: var(--orange);
            animation: pulse 1s infinite;
        }

        .timer.ended {
            color: var(--pink);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .section-progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin: 12px 0;
            overflow: hidden;
        }

        .section-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--teal));
            width: 0%;
            transition: width 1s linear;
        }

        .overall-progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 6px;
            margin: 16px 0;
            overflow: hidden;
        }

        .overall-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--pink), var(--purple));
            width: 0%;
            transition: width 1s linear;
        }

        .next-section {
            background: #f5f0ff;
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
        }

        .next-section .label {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 4px;
        }

        .next-section .name {
            font-weight: 600;
            color: var(--purple);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .sub-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            font-family: inherit;
        }

        button:active { transform: scale(0.96); }

        .btn-primary {
            background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--dark);
        }

        .btn-skip {
            background: #fff5e6;
            color: var(--orange);
        }

        .btn-sub {
            background: #e8f8f5;
            color: var(--teal);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;
            font-size: 0.85em;
            color: #888;
        }

        .time-status {
            background: #f5f0ff;
            border-radius: 14px;
            padding: 14px;
            margin-top: 16px;
        }

        .time-status .row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }

        .time-status .label {
            color: #888;
        }

        .time-status .value {
            font-weight: 600;
            color: var(--purple);
        }

        .time-status .variance.ahead {
            color: var(--teal);
        }

        .time-status .variance.behind {
            color: var(--orange);
        }

        .time-status .variance.on-time {
            color: var(--purple);
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Science of Skating — Class 2</h1>
            <div class="date-line">August 9 • 2:30pm – 3:39pm</div>

            <div class="section-label">Main Section</div>
            <div class="main-section" id="mainSection">Press Start to begin</div>

            <div class="section-label">Current Step</div>
            <div class="sub-section" id="subSection">—</div>

            <div class="timer" id="timerDisplay">--:--</div>

            <div class="section-progress-bar">
                <div class="section-progress-fill" id="sectionProgressFill"></div>
            </div>

            <div class="overall-progress-bar">
                <div class="overall-progress-fill" id="overallProgressFill"></div>
            </div>

            <div class="next-section">
                <div class="label">Up Next</div>
                <div class="name" id="nextStep">—</div>
            </div>

            <div class="time-status" id="timeStatus">
                <div class="row">
                    <span class="label">Expected Time:</span>
                    <span class="value" id="expectedTime">--:--</span>
                </div>
                <div class="row">
                    <span class="label">Actual Time:</span>
                    <span class="value" id="actualTime">--:--</span>
                </div>
                <div class="row">
                    <span class="label">Variance:</span>
                    <span class="value variance" id="variance">—</span>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn-primary">Start</button>
                <button id="pauseBtn" class="btn-secondary hidden">Pause</button>
                <button id="resumeBtn" class="btn-primary hidden">Resume</button>
                <button id="prevBtn" class="btn-skip" disabled>Previous Section</button>
                <button id="nextBtn" class="btn-skip" disabled>Next Section</button>
            </div>

            <div class="sub-controls">
                <button id="prevSubBtn" class="btn-sub" disabled>Previous Step</button>
                <button id="nextSubBtn" class="btn-sub" disabled>Next Step</button>
            </div>

            <div class="status" id="statusText">Ready</div>
        </div>
    </div>

    <script>
        const schedule = [
            {
                name: "Active Sock-Skating Warm-Up",
                duration: 5 * 60,
                subsections: [
                    { name: "Sock skate down and back", duration: 75 },
                    { name: "Lateral sliding down and back", duration: 75 },
                    { name: "Move backward down and back", duration: 75 },
                    { name: "Sock-skate pivots", duration: 75 }
                ]
            },
            { name: "Static Stretching", duration: 10 * 60 },
            { name: "Position Levels Introduction (5–3)", duration: 5 * 60 },
            {
                name: "Intro to Toe Manuals",
                duration: 5 * 60,
                subsections: [
                    { name: "Setup: split stance at position 3.5", duration: 30 },
                    { name: "Front foot toe manual", duration: 60 },
                    { name: "Back foot toe manual", duration: 60 },
                    { name: "Both heels", duration: 60 },
                    { name: "Switch foot positions / repeat", duration: 90 }
                ]
            },
            {
                name: "Intro to Heel Manuals",
                duration: 5 * 60,
                subsections: [
                    { name: "Setup reminder: split stance", duration: 30 },
                    { name: "Front foot heel manual", duration: 60 },
                    { name: "Back foot heel manual", duration: 60 },
                    { name: "Both toes", duration: 60 },
                    { name: "Switch foot positions / repeat", duration: 90 }
                ]
            },
            { name: "Skate Up + Roll Around the Floor", duration: 5 * 60 },
            {
                name: "Class 1 Review: One-Foot Balance + Front/Back Stepovers",
                duration: 5 * 60,
                subsections: [
                    { name: "One-foot balance drill", duration: 90 },
                    { name: "Add a front stepover", duration: 90 },
                    { name: "Add a back stepover", duration: 90 },
                    { name: "Reminders / transition", duration: 30 }
                ]
            },
            {
                name: "Skated Toe Manuals",
                duration: 8 * 60,
                subsections: [
                    { name: "Setup: on-skates split stance", duration: 60 },
                    { name: "Front skate toe manual", duration: 90 },
                    { name: "Back skate toe manual", duration: 90 },
                    { name: "Both heels", duration: 90 },
                    { name: "Switch skate positions / repeat", duration: 90 },
                    { name: "Transition / practice", duration: 60 }
                ]
            },
            {
                name: "Skated Heel Manuals",
                duration: 8 * 60,
                subsections: [
                    { name: "Setup reminder: on-skates split stance", duration: 60 },
                    { name: "Front skate heel manual", duration: 90 },
                    { name: "Back skate heel manual", duration: 90 },
                    { name: "Both toes", duration: 90 },
                    { name: "Switch skate positions / repeat", duration: 90 },
                    { name: "Transition / practice", duration: 60 }
                ]
            },
            { name: "Open Practice + Short Rotating Feedback", duration: 8 * 60 },
            { name: "Static Cool-Down Stretch", duration: 5 * 60 }
        ];

        let currentSectionIndex = -1;
        let currentSubIndex = -1;
        let timeRemaining = 0;
        let timerInterval = null;
        let clockInterval = null;
        let isPaused = false;
        let audioCtx = null;
        let totalDuration = 0;
        const classStartTime = { hour: 14, minute: 30 }; // 2:30 PM

        schedule.forEach(s => {
            totalDuration += s.duration;
            if (s.subsections) {
                const subTotal = s.subsections.reduce((sum, sub) => sum + sub.duration, 0);
                if (subTotal !== s.duration) {
                    console.warn(`Subsection durations for "${s.name}" sum to ${subTotal}, expected ${s.duration}`);
                }
            }
        });

        const mainSectionEl = document.getElementById('mainSection');
        const subSectionEl = document.getElementById('subSection');
        const timerDisplayEl = document.getElementById('timerDisplay');
        const nextStepEl = document.getElementById('nextStep');
        const sectionProgressFillEl = document.getElementById('sectionProgressFill');
        const overallProgressFillEl = document.getElementById('overallProgressFill');
        const statusTextEl = document.getElementById('statusText');
        const expectedTimeEl = document.getElementById('expectedTime');
        const actualTimeEl = document.getElementById('actualTime');
        const varianceEl = document.getElementById('variance');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevSubBtn = document.getElementById('prevSubBtn');
        const nextSubBtn = document.getElementById('nextSubBtn');

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function beep() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function getCurrentItem() {
            if (currentSectionIndex < 0 || currentSectionIndex >= schedule.length) return null;
            const section = schedule[currentSectionIndex];
            if (section.subsections && currentSubIndex >= 0 && currentSubIndex < section.subsections.length) {
                return { type: 'sub', section: section, item: section.subsections[currentSubIndex] };
            }
            return { type: 'section', section: section, item: section };
        }

        function getNextStepName() {
            if (currentSectionIndex < 0) return "Start";
            if (currentSectionIndex >= schedule.length) return "—";

            const section = schedule[currentSectionIndex];
            if (section.subsections && currentSubIndex + 1 < section.subsections.length) {
                return section.subsections[currentSubIndex + 1].name;
            }
            if (currentSectionIndex + 1 < schedule.length) {
                return schedule[currentSectionIndex + 1].name;
            }
            return "End of class";
        }

        function getElapsedTime() {
            let elapsed = 0;
            for (let i = 0; i < currentSectionIndex; i++) {
                elapsed += schedule[i].duration;
            }
            if (currentSectionIndex >= 0 && currentSectionIndex < schedule.length) {
                const section = schedule[currentSectionIndex];
                if (section.subsections && currentSubIndex >= 0) {
                    for (let j = 0; j < currentSubIndex; j++) {
                        elapsed += section.subsections[j].duration;
                    }
                    elapsed += (section.subsections[currentSubIndex].duration - timeRemaining);
                } else {
                    elapsed += (section.duration - timeRemaining);
                }
            }
            return elapsed;
        }

        function formatClockTime(date) {
            let h = date.getHours();
            const m = date.getMinutes();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            h = h ? h : 12;
            return `${h}:${m.toString().padStart(2, '0')} ${ampm}`;
        }

        function getExpectedDate() {
            const now = new Date();
            const expected = new Date(now.getFullYear(), now.getMonth(), now.getDate(), classStartTime.hour, classStartTime.minute, 0);
            expected.setSeconds(expected.getSeconds() + getElapsedTime());
            return expected;
        }

        function updateTimeStatus() {
            if (currentSectionIndex < 0 || currentSectionIndex >= schedule.length) {
                expectedTimeEl.textContent = '--:--';
                actualTimeEl.textContent = '--:--';
                varianceEl.textContent = '—';
                varianceEl.className = 'value variance';
                return;
            }

            const expected = getExpectedDate();
            const actual = new Date();
            const diffSeconds = Math.round((actual - expected) / 1000);
            const diffMinutes = Math.round(diffSeconds / 60);

            expectedTimeEl.textContent = formatClockTime(expected);
            actualTimeEl.textContent = formatClockTime(actual);

            varianceEl.classList.remove('ahead', 'behind', 'on-time');
            if (diffMinutes > 0) {
                varianceEl.textContent = `${diffMinutes} min behind`;
                varianceEl.classList.add('behind');
            } else if (diffMinutes < 0) {
                varianceEl.textContent = `${Math.abs(diffMinutes)} min ahead`;
                varianceEl.classList.add('ahead');
            } else {
                varianceEl.textContent = 'On time';
                varianceEl.classList.add('on-time');
            }
        }

        function updateDisplay() {
            if (currentSectionIndex < 0 || currentSectionIndex >= schedule.length) {
                mainSectionEl.textContent = "Class Complete";
                subSectionEl.textContent = "Great job!";
                timerDisplayEl.textContent = "00:00";
                nextStepEl.textContent = "—";
                sectionProgressFillEl.style.width = "100%";
                overallProgressFillEl.style.width = "100%";
                updateTimeStatus();
                timerDisplayEl.className = "timer ended";
                return;
            }

            const current = getCurrentItem();
            const section = current.section;
            const item = current.item;

            mainSectionEl.textContent = section.name;
            subSectionEl.textContent = item.name;
            timerDisplayEl.textContent = formatTime(timeRemaining);
            nextStepEl.textContent = getNextStepName();

            const progress = ((item.duration - timeRemaining) / item.duration) * 100;
            sectionProgressFillEl.style.width = `${Math.max(0, Math.min(100, progress))}%`;

            const overallProgress = (getElapsedTime() / totalDuration) * 100;
            overallProgressFillEl.style.width = `${Math.max(0, Math.min(100, overallProgress))}%`;

            updateTimeStatus();

            timerDisplayEl.classList.remove('warning', 'ended');
            if (timeRemaining <= 0) {
                timerDisplayEl.classList.add('ended');
            } else if (timeRemaining <= 15) {
                timerDisplayEl.classList.add('warning');
            }
        }

        function tick() {
            if (isPaused) return;

            timeRemaining--;
            updateDisplay();

            if (timeRemaining <= 0) {
                beep();
                advanceStep();
            }
        }

        function advanceStep() {
            if (currentSectionIndex < 0 || currentSectionIndex >= schedule.length) return;

            const section = schedule[currentSectionIndex];
            if (section.subsections && currentSubIndex + 1 < section.subsections.length) {
                goToSubSection(currentSectionIndex, currentSubIndex + 1);
            } else if (currentSectionIndex + 1 < schedule.length) {
                goToSection(currentSectionIndex + 1);
            } else {
                endClass();
            }
        }

        function goToSubSection(sectionIndex, subIndex) {
            if (sectionIndex < 0 || sectionIndex >= schedule.length) return;
            const section = schedule[sectionIndex];
            if (!section.subsections || subIndex < 0 || subIndex >= section.subsections.length) return;

            currentSectionIndex = sectionIndex;
            currentSubIndex = subIndex;
            timeRemaining = section.subsections[subIndex].duration;
            isPaused = false;
            updateDisplay();
            updateStatus();
            updateButtons();
        }

        function goToSection(index) {
            if (index < 0 || index >= schedule.length) return;
            currentSectionIndex = index;
            const section = schedule[index];
            if (section.subsections && section.subsections.length > 0) {
                currentSubIndex = 0;
                timeRemaining = section.subsections[0].duration;
            } else {
                currentSubIndex = -1;
                timeRemaining = section.duration;
            }
            isPaused = false;
            updateDisplay();
            updateStatus();
            updateButtons();
        }

        function updateStatus() {
            statusTextEl.textContent = `Section ${currentSectionIndex + 1} of ${schedule.length}`;
        }

        function updateButtons() {
            prevBtn.disabled = currentSectionIndex <= 0;
            nextBtn.disabled = currentSectionIndex >= schedule.length - 1;

            const section = currentSectionIndex >= 0 && currentSectionIndex < schedule.length
                ? schedule[currentSectionIndex]
                : null;
            const hasSubs = section && section.subsections && section.subsections.length > 0;

            prevSubBtn.disabled = !hasSubs || currentSubIndex <= 0;
            nextSubBtn.disabled = !hasSubs || currentSubIndex >= section.subsections.length - 1;
        }

        function startClock() {
            if (clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(updateTimeStatus, 1000);
        }

        function stopClock() {
            if (clockInterval) clearInterval(clockInterval);
            clockInterval = null;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            goToSection(0);
            timerInterval = setInterval(tick, 1000);
            startClock();
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            resumeBtn.classList.add('hidden');
            statusTextEl.textContent = "Running";
        }

        function pauseTimer() {
            isPaused = true;
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.remove('hidden');
            statusTextEl.textContent = "Paused";
        }

        function resumeTimer() {
            isPaused = false;
            resumeBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            statusTextEl.textContent = "Running";
        }

        function endClass() {
            clearInterval(timerInterval);
            timerInterval = null;
            stopClock();
            currentSectionIndex = schedule.length;
            currentSubIndex = -1;
            timeRemaining = 0;
            updateDisplay();
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.add('hidden');
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            prevSubBtn.disabled = true;
            nextSubBtn.disabled = true;
            statusTextEl.textContent = "Class complete";
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resumeBtn.addEventListener('click', resumeTimer);

        prevBtn.addEventListener('click', () => {
            if (currentSectionIndex > 0) goToSection(currentSectionIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentSectionIndex + 1 < schedule.length) goToSection(currentSectionIndex + 1);
            else endClass();
        });

        prevSubBtn.addEventListener('click', () => {
            if (currentSubIndex > 0) goToSubSection(currentSectionIndex, currentSubIndex - 1);
        });

        nextSubBtn.addEventListener('click', () => {
            const section = schedule[currentSectionIndex];
            if (section.subsections && currentSubIndex + 1 < section.subsections.length) {
                goToSubSection(currentSectionIndex, currentSubIndex + 1);
            }
        });

        updateDisplay();
    </script>
</body>
</html>
