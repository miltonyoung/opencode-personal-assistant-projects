# Token-based shared tunnel.
# Routing is managed in the Cloudflare Zero Trust dashboard.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    networks:
      - cloudflare-net
    restart: unless-stopped

networks:
  cloudflare-net:
    name: cloudflare-net
    driver: bridge
